<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>临床试验入排审核系统</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--primary:#FF9900;--secondary:#336699;--success:#28a745;--danger:#dc3545;--warning:#fd7e14;--info:#17a2b8;--gray-100:#f8f9fa;--gray-200:#e9ecef;--gray-300:#dee2e6;--gray-400:#ced4da;--gray-500:#adb5bd;--gray-600:#6c757d;--gray-700:#495057;--gray-800:#343a40;--gray-900:#212529;--font:system-ui,-apple-system,"微软雅黑","Microsoft YaHei","Segoe UI",Roboto,sans-serif;--shadow:0 2px 8px rgba(0,0,0,0.1);--shadow-lg:0 8px 24px rgba(0,0,0,0.15);--radius:8px}
html{width:100%;min-width:100%;max-width:100%;overflow-x:hidden}
body{font-family:var(--font);background:var(--gray-100);color:var(--gray-800);line-height:1.6;min-height:100vh;width:100%;min-width:100%;max-width:100%;overflow-x:hidden}
a{color:var(--secondary);text-decoration:none}
a:hover{text-decoration:underline}
button{font-family:var(--font);cursor:pointer;border:none;border-radius:var(--radius);padding:8px 16px;font-size:14px;transition:all .2s}
button:disabled{opacity:.6;cursor:not-allowed}
input,textarea,select{font-family:var(--font);border:1px solid var(--gray-400);border-radius:var(--radius);padding:8px 12px;font-size:14px;outline:none;transition:border .2s;max-width:100%;min-width:0}
select{width:100%}
input:focus,textarea:focus,select:focus{border-color:var(--secondary);box-shadow:0 0 0 3px rgba(51,102,153,.15)}
table{width:100%;border-collapse:collapse}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--gray-200);font-size:14px;vertical-align:middle}
th{background:var(--gray-100);font-weight:600;color:var(--gray-700);position:sticky;top:0}
.btn{display:inline-flex;align-items:center;gap:6px;font-weight:500;white-space:nowrap}
.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:#e68a00}
.btn-secondary{background:var(--secondary);color:#fff}.btn-secondary:hover{background:#2a5a8a}
.btn-success{background:var(--success);color:#fff}.btn-success:hover{background:#218838}
.btn-danger{background:var(--danger);color:#fff}.btn-danger:hover{background:#c82333}
.btn-warning{background:var(--warning);color:#fff}.btn-warning:hover{background:#e0691a}
.btn-outline{background:transparent;border:1px solid var(--gray-400);color:var(--gray-700)}.btn-outline:hover{background:var(--gray-100)}
.btn-sm{padding:4px 10px;font-size:12px}
.btn-lg{padding:12px 24px;font-size:16px}

/* Layout */
#app{width:100%;max-width:none;margin:0;padding:0 32px;min-width:0}
.header{width:100%;max-width:none;background:#fff;border-bottom:2px solid var(--primary);padding:16px 24px;margin-bottom:24px;box-shadow:var(--shadow)}
.header-inner{width:100%;max-width:none;margin:0;display:flex;align-items:center;justify-content:space-between;gap:16px;min-width:0}
.header h1{font-size:20px;color:var(--gray-900);display:flex;align-items:center;gap:10px;min-width:0;line-height:1.35}
.header h1 .logo{color:var(--primary);font-size:24px}
.header-sub{color:var(--gray-600);font-size:12px;margin-top:2px}
.header-right{display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:flex-end;min-width:0}
.brand-logo{height:42px;width:auto;max-width:min(240px,42vw);object-fit:contain}

/* Toast */
.toast-container{position:fixed;top:20px;right:20px;z-index:10000;display:flex;flex-direction:column;gap:8px;max-width:380px}
.toast{padding:12px 16px;border-radius:var(--radius);color:#fff;font-size:14px;box-shadow:var(--shadow-lg);animation:slideIn .3s ease;display:flex;align-items:flex-start;gap:10px;position:relative}
.toast.success{background:var(--success)}.toast.error{background:var(--danger)}.toast.info{background:var(--info)}.toast.warning{background:var(--warning)}
.toast .close{position:absolute;top:6px;right:8px;background:none;color:#fff;font-size:16px;padding:0;opacity:.7}.toast .close:hover{opacity:1}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes fadeOut{from{opacity:1}to{opacity:0;transform:translateX(100%)}}

/* Cards */
.card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:16px;transition:box-shadow .2s;min-width:0;overflow-wrap:anywhere}
.card:hover{box-shadow:var(--shadow-lg)}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.card-title{font-size:16px;font-weight:600;color:var(--gray-900)}

/* Badge */
.badge{display:inline-flex;align-items:center;justify-content:center;padding:2px 10px;border-radius:12px;font-size:12px;font-weight:500;white-space:nowrap;line-height:1.6}
.badge-pending{background:#e9ecef;color:#6c757d}.badge-processing{background:#cce5ff;color:#004085}
.badge-reviewed{background:#d4edda;color:#155724}.badge-error{background:#f8d7da;color:#721c24}
.badge-pass{background:#d4edda;color:#155724}.badge-fail{background:#f8d7da;color:#721c24}
.badge-insufficient{background:#fff3cd;color:#856404}.badge-investigator{background:#fff3cd;color:#856404}.badge-verify{background:#f0fdf4;color:#3f6212}

/* Verdict */
.verdict-card{text-align:center;padding:32px;margin-bottom:24px;border-radius:var(--radius);border:2px solid}
.verdict-pass{background:#f0fff4;border-color:var(--success)}.verdict-fail{background:#fff5f5;border-color:var(--danger)}
.verdict-insufficient{background:#fffaf0;border-color:var(--warning)}
.verdict-icon{font-size:48px;margin-bottom:8px}.verdict-text{font-size:22px;font-weight:700}
.verdict-summary{margin-top:8px;color:var(--gray-600);font-size:14px}

/* Tabs */
.tabs{display:flex;border-bottom:2px solid var(--gray-200);margin-bottom:20px}
.tab{padding:10px 20px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;font-weight:500;color:var(--gray-600);transition:all .2s;background:none}
.tab:hover{color:var(--gray-800)}
.tab.active{color:var(--secondary);border-bottom-color:var(--secondary)}
.tab-content{display:none}.tab-content.active{display:block}

/* Upload Zone */
.upload-zone{border:2px dashed var(--gray-400);border-radius:var(--radius);padding:40px;text-align:center;cursor:pointer;transition:all .2s;background:var(--gray-100);margin-bottom:16px}
.upload-zone:hover,.upload-zone.dragover{border-color:var(--primary);background:#fff8eb}
.upload-zone .icon{font-size:48px;margin-bottom:12px;opacity:.5}
.upload-zone p{color:var(--gray-600);font-size:14px}
.upload-zone .hint{font-size:12px;color:var(--gray-500);margin-top:8px}
.file-list{margin-top:12px}
.file-item{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:var(--gray-100);border-radius:var(--radius);margin-bottom:4px;font-size:13px}

/* Expandable Row */
.expand-row{cursor:pointer;transition:background .15s}
.expand-row:hover{background:#f8f9fa}
.expand-row td:first-child{position:relative;padding-left:28px}
.expand-row td:first-child::before{content:'▶';position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:10px;color:var(--gray-500);transition:transform .2s}
.expand-row.open td:first-child::before{transform:translateY(-50%) rotate(90deg)}
.expand-detail{display:none}
.expand-detail.show{display:table-row}
.expand-detail td{padding:16px 28px;background:#fafbfc;border-bottom:2px solid var(--gray-200)}
.expand-content{font-size:13px;line-height:1.8}
.expand-content .reasoning{margin-bottom:8px}
.expand-content .evidence{background:#f0f4f8;padding:12px;border-radius:var(--radius);border-left:3px solid var(--secondary);font-size:13px;white-space:pre-wrap}

/* Progress Overlay */
.overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:9000;display:flex;align-items:center;justify-content:center;animation:fadeIn .3s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.overlay-content{background:#fff;border-radius:12px;padding:40px;width:480px;box-shadow:var(--shadow-lg);text-align:center}
.overlay-content h3{font-size:18px;margin-bottom:20px;color:var(--gray-900)}
.progress-stages{display:flex;justify-content:space-between;margin-bottom:24px;position:relative}
.progress-stages::before{content:'';position:absolute;top:16px;left:40px;right:40px;height:3px;background:var(--gray-300);z-index:0}
.stage-item{display:flex;flex-direction:column;align-items:center;z-index:1;gap:6px}
.stage-dot{width:32px;height:32px;border-radius:50%;background:var(--gray-300);display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;font-weight:600;transition:all .3s}
.stage-dot.active{background:var(--primary);animation:pulse 1.5s infinite}
.stage-dot.done{background:var(--success)}
.stage-label{font-size:11px;color:var(--gray-600);white-space:nowrap}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,153,0,.4)}50%{box-shadow:0 0 0 8px rgba(255,153,0,0)}}
.progress-bar-wrap{height:8px;background:var(--gray-200);border-radius:4px;overflow:hidden;margin-bottom:12px}
.progress-bar{height:100%;background:linear-gradient(90deg,var(--primary),#ffb84d);border-radius:4px;transition:width .5s ease;width:0}
.progress-text{font-size:14px;color:var(--gray-600);margin-bottom:20px}
.progress-stage-text{font-size:13px;color:var(--gray-500);margin-bottom:16px}
.progress-container .progress-bar{height:8px;background:var(--gray-200);border-radius:4px;overflow:hidden;width:100%;margin-bottom:8px}
.progress-container .progress-fill{height:100%;background:linear-gradient(90deg,var(--primary),#ffb84d);border-radius:4px;transition:width .4s ease}

/* Modal */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.45);z-index:8000;display:flex;align-items:center;justify-content:center;animation:fadeIn .2s}
.modal{background:#fff;border-radius:12px;box-shadow:var(--shadow-lg);width:500px;max-width:90vw;max-height:90vh;overflow:auto;animation:modalIn .3s ease}
@keyframes modalIn{from{transform:scale(.95);opacity:0}to{transform:scale(1);opacity:1}}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;border-bottom:1px solid var(--gray-200)}
.modal-header h3{font-size:16px}
.modal-body{padding:24px}
.modal-footer{display:flex;justify-content:flex-end;gap:10px;padding:16px 24px;border-top:1px solid var(--gray-200)}
.form-group{margin-bottom:16px;min-width:0}
.form-group label{display:block;margin-bottom:6px;font-size:14px;font-weight:500;color:var(--gray-700)}
.form-group input,.form-group textarea{width:100%}

/* Callout */
.callout{padding:14px 18px;border-radius:var(--radius);margin:12px 0;font-size:14px;display:flex;gap:10px;align-items:flex-start}
.callout-warning{background:#fff3cd;border-left:4px solid var(--warning);color:#856404}
.callout-info{background:#cce5ff;border-left:4px solid var(--info);color:#004085}
.callout-success{background:#d4edda;border-left:4px solid var(--success);color:#155724}

/* Breadcrumb */
.breadcrumb{display:flex;align-items:center;gap:8px;margin-bottom:20px;font-size:14px;color:var(--gray-600)}
.breadcrumb a{color:var(--secondary)}
.breadcrumb .sep{color:var(--gray-400)}

/* Rule Textarea */
.rule-editor{width:100%;min-height:400px;font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;font-size:13px;line-height:1.6;padding:16px;border:1px solid var(--gray-300);border-radius:var(--radius);resize:vertical}

/* Stats */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin:12px 0}
.stat-item{text-align:center;padding:12px;background:var(--gray-100);border-radius:var(--radius)}
.stat-value{font-size:24px;font-weight:700;color:var(--gray-900)}
.stat-label{font-size:12px;color:var(--gray-600);margin-top:4px}

/* Empty State */
.empty-state{text-align:center;padding:60px 20px;color:var(--gray-500)}
.empty-state .icon{font-size:64px;margin-bottom:16px;opacity:.4}
.empty-state h3{font-size:18px;color:var(--gray-700);margin-bottom:8px}

/* Loading Spinner */
.spinner{display:inline-block;width:20px;height:20px;border:2px solid var(--gray-300);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{display:flex;align-items:center;gap:10px;color:var(--gray-600);font-size:14px}

/* Project Card */
.project-card{display:flex;justify-content:space-between;align-items:center;gap:16px;min-width:0}
.project-card .info{flex:1;min-width:0}
.project-card .info h3{font-size:16px;margin-bottom:4px;color:var(--gray-900);overflow-wrap:anywhere;line-height:1.5}
.project-card .info .meta{font-size:12px;color:var(--gray-500)}
.project-card .actions{display:flex;gap:8px;flex-shrink:0}

/* Protocol Workbench */
.protocol-workbench{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:18px;min-width:0;overflow-wrap:anywhere}
.workbench-grid{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.5fr) minmax(0,.9fr);gap:14px;align-items:stretch;min-width:0}
.workbench-panel{border:1px solid var(--gray-200);border-radius:var(--radius);padding:14px;background:#fff;min-width:0;overflow-wrap:anywhere}
.workbench-panel h3{font-size:14px;color:var(--gray-800);margin-bottom:10px}
.workbench-meta{display:flex;flex-direction:column;gap:6px;margin-top:10px;font-size:12px;color:var(--gray-600)}
.workbench-meta div{display:grid;grid-template-columns:minmax(96px,180px) minmax(0,1fr);gap:12px;align-items:start;border-bottom:1px solid var(--gray-100);padding-bottom:4px}
.workbench-meta strong{min-width:0;text-align:left;color:var(--gray-700);overflow-wrap:anywhere;word-break:break-word}
.workbench-editor{width:100%;min-height:520px;font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;font-size:13px;line-height:1.55;padding:12px;border:1px solid var(--gray-300);border-radius:var(--radius);resize:vertical}
.workbench-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.workbench-chat{height:210px;overflow:auto;border:1px solid var(--gray-200);border-radius:var(--radius);padding:10px;background:var(--gray-100);font-size:13px;margin-bottom:10px}
.chat-row{margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--gray-200)}
.chat-row:last-child{border-bottom:none}
.chat-role{font-weight:600;color:var(--secondary);font-size:12px;margin-bottom:3px}
.status-line{font-size:12px;color:var(--gray-600);margin-top:8px;min-height:18px}
.task-grid{display:grid;grid-template-columns:repeat(3,minmax(220px,1fr));gap:16px;margin:18px 0}
.task-card{background:#fff;border:1px solid var(--gray-200);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;min-height:180px;display:flex;flex-direction:column;justify-content:space-between;min-width:0;overflow-wrap:anywhere}
.task-card h3{font-size:17px;color:var(--gray-900);margin-bottom:8px}
.task-card p{font-size:13px;color:var(--gray-600);line-height:1.7}
.auth-shell{max-width:520px;margin:42px auto;background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:28px}
.auth-shell h2{font-size:22px;margin-bottom:8px;color:var(--gray-900)}
.help-section{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:22px;margin-bottom:16px;min-width:0;overflow-wrap:anywhere}
.help-section h2{font-size:20px;margin-bottom:12px}
.help-section h3{font-size:15px;margin:14px 0 6px;color:var(--gray-800)}
.help-section li{margin-left:18px;margin-bottom:6px;color:var(--gray-700);font-size:14px}
.help-manual-intro{color:var(--gray-600);font-size:14px;margin-bottom:14px}
.help-manual-grid{display:grid;grid-template-columns:repeat(2,minmax(260px,1fr));gap:14px;margin:14px 0}
.help-manual-card{border:1px solid var(--gray-200);border-radius:var(--radius);padding:14px;background:#fff}
.help-manual-card h3{margin-top:0;color:var(--secondary)}
.help-manual-card ol,.help-manual-card ul{margin-top:8px}
.help-manual-note{background:#f7f9fb;border-left:4px solid var(--secondary);border-radius:var(--radius);padding:12px 14px;margin:12px 0;color:var(--gray-700);font-size:14px}
.help-troubleshoot{width:100%;border:1px solid var(--gray-200);border-radius:var(--radius);overflow:hidden;margin-top:10px}
.help-troubleshoot table{margin:0}
.help-troubleshoot th{position:static;background:#f1f5f9}
.help-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.revision-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.diff-list{background:#fff7e6;border-left:4px solid var(--primary);padding:12px 14px;border-radius:var(--radius);font-size:13px;color:var(--gray-800);margin:12px 0}
.guide-card{background:#eef6ff;border-left:4px solid var(--secondary);border-radius:var(--radius);padding:14px 16px;margin-bottom:16px;color:var(--gray-800);font-size:14px}
.header-user{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--gray-600);flex-wrap:wrap;justify-content:flex-end}
.page-row{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;min-width:0}
.project-picker{flex:1 1 420px;min-width:min(320px,100%);max-width:100%}
.project-summary-title{font-size:18px;margin-bottom:10px;line-height:1.55;overflow-wrap:anywhere}
.project-summary-meta{width:100%;max-width:none}
.project-header-row{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;min-width:0}
.project-header-main{min-width:0;flex:1 1 360px}
.project-header-main h2{font-size:20px;color:var(--gray-900);line-height:1.45;overflow-wrap:anywhere}
.project-header-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.rules-toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.rules-toolbar p{color:var(--gray-600);font-size:14px;flex:1 1 360px;min-width:0}
.rules-toolbar .actions{display:flex;gap:8px;flex-wrap:wrap}
.management-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:16px;align-items:start}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(180px,1fr));gap:12px}
.center-row-actions{display:flex;gap:6px;flex-wrap:wrap}
.center-draft-editor{width:100%;min-height:220px;font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;font-size:13px;line-height:1.55}
.export-grid{display:grid;grid-template-columns:repeat(3,minmax(220px,1fr));gap:14px}
.export-card{border:1px solid var(--gray-200);border-radius:var(--radius);padding:16px;background:#fff;min-width:0}
.export-card h3{font-size:15px;color:var(--gray-900);margin-bottom:8px}
.export-card p{font-size:13px;color:var(--gray-600);margin-bottom:12px;line-height:1.7}

/* Responsive Table Wrapper */
.table-wrap{width:100%;max-width:100%;overflow-x:auto;overflow-y:visible;background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);-webkit-overflow-scrolling:touch}
.table-wrap table{margin:0}
.data-table{width:100%;min-width:0;table-layout:auto}
.data-table th{white-space:nowrap}
.data-table td{overflow-wrap:anywhere}
.cell-nowrap{white-space:nowrap}
.cell-center{word-break:normal;overflow-wrap:break-word}
.row-actions{display:flex;gap:.35rem;flex-wrap:wrap;align-items:center;min-width:0}
.row-actions .btn-sm{padding:.35rem .5rem;font-size:.78rem;line-height:1.2}
.subjects-toolbar{display:flex;justify-content:space-between;gap:.75rem;align-items:flex-end;flex-wrap:wrap;margin-bottom:.75rem}
.subjects-filter{display:flex;gap:.5rem;align-items:flex-end;flex-wrap:wrap}
.subjects-filter .form-group{margin-bottom:0}
.subjects-bulk-actions{display:flex;gap:.45rem;flex-wrap:wrap;align-items:center}
.selected-count{color:var(--gray-500);font-size:.82rem}
	.subjects-table{width:100%;min-width:0}
	.subjects-table th,.subjects-table td{padding:.75rem .65rem;vertical-align:middle}
	.subjects-table th{white-space:normal}
	.subjects-table .sort-header{white-space:normal;text-align:left}
.subjects-table .table-filter-row th{padding-block:.35rem;background:#fbfcfd}
.sort-header{display:inline-flex;align-items:center;gap:.25rem;border:0;background:transparent;color:inherit;font:inherit;font-weight:700;padding:0;cursor:pointer;white-space:nowrap}
.sort-header:hover{color:var(--secondary)}
.sort-icon{color:var(--gray-500);font-size:.72rem}
.column-filter{inline-size:100%;min-inline-size:0;border:1px solid var(--gray-300);border-radius:.35rem;padding:.35rem .45rem;font-size:.78rem;background:#fff;color:var(--gray-800)}
.column-filter:focus{outline:none;border-color:var(--secondary);box-shadow:0 0 0 2px rgba(21,101,192,.12)}
.subjects-table .col-select,.subjects-table .select-cell{white-space:nowrap;text-align:center}
.subject-id-cell{font-weight:700;white-space:nowrap}
.center-cell{line-height:1.35;min-width:0}
.center-cell .center-code{font-weight:700;color:var(--gray-800);white-space:nowrap}
.center-cell .center-name{font-size:.78rem;color:var(--gray-500);overflow-wrap:anywhere;margin-top:.1rem}
.icf-cell{display:flex;gap:.35rem;align-items:center;flex-wrap:wrap}

<body>

<div class="toast-container" id="toastContainer"></div>
<div id="overlayContainer"></div>
<div id="modalContainer"></div>

<div class="header">
  <div class="header-inner">
    <div>
      <h1><span class="logo">⚕</span> 临床试验入排审核系统</h1>
      <div class="header-sub">Clinical Trial Enrollment Review System</div>
    </div>
    <div class="header-right">
      <img class="brand-logo" src="/static/header_logo.svg" alt="ER入排审核标志">
      <div id="headerNav"></div>
    </div>
  </div>
</div>

<div id="app"></div>

<script>
const API = '/api';
const app = document.getElementById('app');

/* ============ State ============ */
let state = {
  view: '',
  projects: [],
  currentProject: null,
  currentSubject: null,
  subjects: [],
  subjectTableFilters: {},
  subjectTableSort: {},
  selectedSubjects: {},
  report: null,
  auth: {
    loaded: false,
    hasUsers: true,
    user: localStorage.getItem('enrollmentReviewUser') || '',
    token: localStorage.getItem('enrollmentReviewToken') || '',
    role: localStorage.getItem('enrollmentReviewRole') || '',
  },
  protocolWorkbench: {
    file: null,
    metadata: null,
    workflow: null,
    studyStage: '',
    rules: '',
    chatLog: [],
    lastProjectCode: '',
  },
  reDeconstruct: {
    projectCode: '',
    project: null,
    originalRules: '',
    revisedRules: '',
    workflow: null,
    metadata: null,
    file: null,
    studyStage: '',
    changes: [],
  },
};

/* ============ Toast ============ */
function toast(msg, type = 'info', duration = 4000) {
  const container = document.getElementById('toastContainer');
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.innerHTML = `<span>${msg}</span><button class="close" onclick="this.parentElement.remove()">&times;</button>`;
  container.appendChild(el);
  setTimeout(() => { el.style.animation = 'fadeOut .3s ease forwards'; setTimeout(() => el.remove(), 300); }, duration);
}

/* ============ Modal ============ */
function showModal(title, bodyHtml, footerHtml) {
  const c = document.getElementById('modalContainer');
  c.innerHTML = `<div class="modal-overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <div class="modal-header"><h3>${title}</h3><button onclick="closeModal()" style="background:none;font-size:20px;padding:0;color:var(--gray-500)">&times;</button></div>
      <div class="modal-body">${bodyHtml}</div>
      ${footerHtml ? `<div class="modal-footer">${footerHtml}</div>` : ''}
    </div>
  </div>`;
}
function closeModal() { document.getElementById('modalContainer').innerHTML = ''; }

/* ============ Overlay ============ */
function showProgressOverlay() {
  document.getElementById('overlayContainer').innerHTML = `<div class="overlay" id="progressOverlay">
    <div class="overlay-content">
      <h3>正在处理受试者资料</h3>
      <div class="progress-stages">
        <div class="stage-item"><div class="stage-dot" id="stage0">1</div><div class="stage-label">分类</div></div>
        <div class="stage-item"><div class="stage-dot" id="stage1">2</div><div class="stage-label">OCR</div></div>
        <div class="stage-item"><div class="stage-dot" id="stage2">3</div><div class="stage-label">组包</div></div>
        <div class="stage-item"><div class="stage-dot" id="stage3">4</div><div class="stage-label">智能审核</div></div>
      </div>
      <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
      <div class="progress-text" id="progressPercent">0%</div>
      <div class="progress-stage-text" id="progressStageText">准备中...</div>
      <button class="btn btn-outline" onclick="cancelProcessing()" id="cancelBtn">取消</button>
    </div>
  </div>`;
}
function updateProgress(data) {
  const stageMap = { classify: 0, ocr: 1, bundle: 2, review: 3 };
  const idx = stageMap[data.stage];
  if (idx !== undefined) {
    for (let i = 0; i < idx; i++) { const d = document.getElementById('stage' + i); if (d) { d.classList.remove('active'); d.classList.add('done'); d.textContent = '✓'; } }
    const cur = document.getElementById('stage' + idx);
    if (cur) { cur.classList.add('active'); cur.classList.remove('done'); }
  }
  // Calculate percentage from progress/total
  const progress = data.progress || 0;
  const total = data.total || 1;
  const pct = total > 0 ? Math.round((progress / total) * 100) : 0;
  const bar = document.getElementById('progressBar');
  const pctEl = document.getElementById('progressPercent');
  const stageText = document.getElementById('progressStageText');
  if (bar) bar.style.width = pct + '%';
  if (pctEl) pctEl.textContent = pct + '%';
  if (stageText && data.message) {
    stageText.textContent = data.message;
    // Color code VLM status
    if (data.message.includes('✅')) stageText.style.color = '#28a745';
    else if (data.message.includes('❌')) stageText.style.color = '#dc3545';
    else stageText.style.color = '';
  }
}
function hideProgress() { document.getElementById('overlayContainer').innerHTML = ''; }
let currentEventSource = null;
function cancelProcessing() { if (currentEventSource) { currentEventSource.close(); currentEventSource = null; } hideProgress(); toast('已取消处理', 'info'); }

/* ============ API ============ */
function authHeaders() {
  const user = state.auth.user || localStorage.getItem('enrollmentReviewUser') || '';
  const token = state.auth.token || localStorage.getItem('enrollmentReviewToken') || '';
  const headers = {};
  if (user && token) {
    headers['X-Enrollment-User'] = user;
    headers['X-Enrollment-Token'] = token;
  }
  return headers;
}
function withAuthOptions(opts = {}) {
  const auth = authHeaders();
  if (!Object.keys(auth).length) return opts;
  const headers = new Headers(opts.headers || {});
  Object.entries(auth).forEach(([k, v]) => headers.set(k, v));
  return { ...opts, headers };
}
async function apiFetch(url, opts = {}) {
  try {
    const { skipAuth, ...fetchOpts } = opts;
    const r = await fetch(url, skipAuth ? fetchOpts : withAuthOptions(fetchOpts));
    if (r.status === 401 && !url.includes('/api/auth/')) {
      logoutUser(false);
      renderHeaderNav();
      renderAuth('login');
      toast('登录状态已失效，请重新登录', 'warning');
    }
    if (!r.ok) {
      const t = await r.text();
      let message = t || r.statusText;
      try {
        const data = JSON.parse(t);
        if (typeof data.detail === 'string') message = data.detail;
        else if (data.detail?.message) message = data.detail.message;
      } catch { /* keep raw text */ }
      throw new Error(message);
    }
    return r;
  } catch (e) { toast('请求失败: ' + e.message, 'error'); throw e; }
}
async function listProjects() { const r = await apiFetch(`${API}/projects`); return r.json(); }
async function authStatus() { const r = await apiFetch(`${API}/auth/status`, { skipAuth: true }); return r.json(); }
async function registerUser(username, password = '') { const r = await apiFetch(`${API}/auth/register`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ username, password }), skipAuth: true }); return r.json(); }
async function loginUser(username, password = '') { const r = await apiFetch(`${API}/auth/login`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ username, password }), skipAuth: true }); return r.json(); }
async function markHelpSeen(username = '') { const r = await apiFetch(`${API}/auth/help-seen`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ username }) }); return r.json(); }
async function createProject(data) { const r = await apiFetch(`${API}/projects`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) }); return r.json(); }
async function createProjectFromProtocol(file, studyStage = '') { const fd = new FormData(); fd.append('file', file); if (studyStage) fd.append('study_stage', studyStage); const r = await apiFetch(`${API}/projects/from-protocol`, { method: 'POST', body: fd }); return r.json(); }
async function deconstructProtocolDraft(file, feedback = '', currentRules = '', studyStage = '') {
  const fd = new FormData();
  fd.append('file', file);
  if (feedback) fd.append('feedback', feedback);
  if (currentRules) fd.append('current_rules', currentRules);
  if (studyStage) fd.append('study_stage', studyStage);
  const r = await apiFetch(`${API}/projects/deconstruct-draft`, { method: 'POST', body: fd });
  return r.json();
}
async function saveProtocolDraft(file, rules, metadata, workflow, targetProjectCode = '') {
  const fd = new FormData();
  if (file) fd.append('file', file);
  fd.append('rules', rules);
  fd.append('metadata_json', JSON.stringify(metadata || {}));
  fd.append('workflow_json', JSON.stringify(workflow || {}));
  if (targetProjectCode) fd.append('target_project_code', targetProjectCode);
  const r = await apiFetch(`${API}/projects/save-protocol-draft`, { method: 'POST', body: fd });
  return r.json();
}
async function deconstructProjectRevision(pc, file, feedback, currentRules, useCurrentProtocol, studyStage = '') {
  const fd = new FormData();
  if (file) fd.append('file', file);
  fd.append('feedback', feedback || '');
  fd.append('current_rules', currentRules || '');
  fd.append('use_current_protocol', useCurrentProtocol ? 'true' : 'false');
  if (studyStage) fd.append('study_stage', studyStage);
  const r = await apiFetch(`${API}/projects/${pc}/deconstruct-revision`, { method:'POST', body: fd });
  return r.json();
}
async function getProject(pc) { const r = await apiFetch(`${API}/projects/${pc}`); return r.json(); }
async function updateProjectInfo(pc, data) { const r = await apiFetch(`${API}/projects/${pc}`, { method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify(data) }); return r.json(); }
async function deleteProject(pc) { const r = await apiFetch(`${API}/projects/${pc}`, { method: 'DELETE' }); return r.json(); }
async function deleteSubject(pc, sid) { const r = await apiFetch(`${API}/projects/${pc}/subjects/${sid}`, { method: 'DELETE' }); return r.json(); }
async function updateSubject(pc, sid, data) { const r = await apiFetch(`${API}/projects/${pc}/subjects/${sid}`, { method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify(data) }); return r.json(); }
async function listSubjects(pc) { const r = await apiFetch(`${API}/projects/${pc}/subjects`); return r.json(); }
async function uploadFiles(pc, sid, files) { const fd = new FormData(); for (const f of files) fd.append('files', f); const r = await apiFetch(`${API}/projects/${pc}/subjects/${sid}/upload`, { method: 'POST', body: fd }); return r.json(); }
async function getCenters(pc) { const r = await apiFetch(`${API}/projects/${pc}/centers`); return r.json(); }
async function saveCenters(pc, centers) { const r = await apiFetch(`${API}/projects/${pc}/centers`, { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ centers }) }); return r.json(); }
async function deconstructCenters(pc, file = null, draftText = '', feedback = '') {
  const fd = new FormData();
  if (file) fd.append('file', file);
  if (draftText) fd.append('draft_text', draftText);
  if (feedback) fd.append('feedback', feedback);
  const r = await apiFetch(`${API}/projects/${pc}/centers/deconstruct`, { method:'POST', body: fd });
  return r.json();
}
async function getProjectPhases(pc) { const r = await apiFetch(`${API}/projects/${pc}/phases`); return r.json(); }
async function getReport(pc, sid, phase = 'full') { const r = await apiFetch(`${API}/projects/${pc}/subjects/${sid}/report?phase=${encodeURIComponent(phase || 'full')}`); return r.json(); }
async function getBundle(pc, sid, phase = 'full') { const r = await apiFetch(`${API}/projects/${pc}/subjects/${sid}/bundle?phase=${encodeURIComponent(phase || 'full')}`); return r.text(); }
async function saveRules(pc, rules) { const r = await apiFetch(`${API}/projects/${pc}/rules`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ rules }) }); return r.json(); }
async function getRules(pc) { const r = await apiFetch(`${API}/projects/${pc}/rules`); return r.json(); }
async function fetchMarkdownReport(pc, opts = {}) {
  const params = new URLSearchParams();
  params.set('scope', opts.scope || 'project');
  params.set('phase', opts.phase || 'full');
  if (opts.centerCode) params.set('center_code', opts.centerCode);
  if (opts.subjectId) params.set('subject_id', opts.subjectId);
  const r = await apiFetch(`${API}/projects/${pc}/reports/markdown?${params.toString()}`);
  return r.text();
}

function processSubject(pc, sid, onProgress, onDone, onError, opts = {}) {
  let retryCount = 0;
  const maxRetries = 3;
  let lastProgress = null;

  function connect() {
    const params = new URLSearchParams();
    params.set('phase', opts.phase || 'full');
    if (opts.studyStage) params.set('study_stage', opts.studyStage);
    const user = state.auth.user || localStorage.getItem('enrollmentReviewUser') || '';
    const token = state.auth.token || localStorage.getItem('enrollmentReviewToken') || '';
    if (user) params.set('user', user);
    if (token) params.set('token', token);
    const es = new EventSource(`${API}/projects/${pc}/subjects/${sid}/process?${params.toString()}`);
    currentEventSource = es;

    es.onmessage = (e) => {
      const data = JSON.parse(e.data);
      lastProgress = data;
      retryCount = 0; // reset retry count on successful message
      onProgress(data);
      if (data.stage === 'done') { es.close(); currentEventSource = null; onDone(data); }
      if (data.stage === 'error') { es.close(); currentEventSource = null; onError(data); }
    };

    es.onerror = () => {
      es.close();
      currentEventSource = null;
      // If we already got a 'done' or 'error' message, don't retry
      if (lastProgress && (lastProgress.stage === 'done' || lastProgress.stage === 'error')) return;
      // Retry on connection error
      if (retryCount < maxRetries) {
        retryCount++;
        onProgress({ stage: lastProgress?.stage || 'ocr', progress: lastProgress?.progress || 0, total: lastProgress?.total || 1, message: `连接中断，正在重试(${retryCount}/${maxRetries})...` });
        setTimeout(connect, 2000); // retry after 2 seconds
      } else {
        onError({ message: '连接中断，已重试多次仍失败' });
      }
    };
  }

  connect();
  return { close: () => { if (currentEventSource) { currentEventSource.close(); currentEventSource = null; } } };
}

/* ============ Routing ============ */
function navigate(hash) { window.location.hash = hash; }
window.addEventListener('hashchange', route);
let _routeRunning = false;
let _routeQueued = false;
async function route() {
  if (_routeRunning) {
    _routeQueued = true;
    return;
  }
  _routeRunning = true;
  try {
    do {
      _routeQueued = false;
      await routeOnce();
    } while (_routeQueued);
  } finally {
    _routeRunning = false;
  }
}
async function routeOnce() {
  await ensureAuthStatus();
  renderHeaderNav();
  if (!hasAuthSession()) return renderAuth();
  const hash = location.hash || '#/';
  const cleanHash = hash.split('?')[0]; // strip query params
  const parts = cleanHash.replace('#/', '').split('/');
  if (parts[0] === '' || parts[0] === 'dashboard' || parts[0] === 'task') return renderTaskHome();
  if (parts[0] === 'help') return renderHelpPage(false);
  if (parts[0] === 'first-deconstruct') return renderFirstDeconstructPage();
  if (parts[0] === 're-deconstruct') return renderReDeconstructPage();
  if (parts[0] === 'audit') return renderAuditProjectList();
  if (parts[0] === 'project' && parts[1] && parts[2] === 'subject' && parts[3]) return renderReport(parts[1], parts[3]);
  if (parts[0] === 'project' && parts[1]) return renderProject(parts[1]);
  renderTaskHome();
}

/* ============ Helpers ============ */
function statusBadge(status) {
  const map = { pending: ['badge-pending', '待处理'], processing: ['badge-processing', '处理中'], reviewed: ['badge-reviewed', '已审核'], error: ['badge-error', '错误'] };
  const [cls, label] = map[status] || ['badge-pending', status];
  return `<span class="badge ${cls}">${label}</span>`;
}
function verdictBadge(verdict) {
  if (!verdict) return '<span class="badge badge-pending">未审核</span>';
  const map = { pass: ['badge-pass', '✅ 可入组'], pass_verify: ['badge-verify', '✓ 可入组（需验证）'], fail: ['badge-fail', '❌ 不可入组'], insufficient: ['badge-insufficient', '⚠️ 证据不足'], needs_evidence: ['badge-insufficient', '⚠️ 需处理'], investigator: ['badge-investigator', '🟡 需研究者判定'] };
  const [cls, label] = map[verdict] || ['badge-pending', verdict];
  return `<span class="badge ${cls}">${label}</span>`;
}
function ruleResultBadge(result) {
  const map = { pass: ['badge-pass', '✅ 通过'], pass_verify: ['badge-verify', '✓ 通过（需验证）'], fail: ['badge-fail', '❌ 不通过'], insufficient: ['badge-insufficient', '⚠️ 证据不足'], investigator: ['badge-investigator', '🟡 需研究者判定'] };
  const [cls, label] = map[result] || ['badge-pending', result || '未评估'];
  return `<span class="badge ${cls}">${label}</span>`;
}
function verificationType(rule) {
  if (!rule || rule.result !== 'pass_verify') return '';
  if (rule.verification_type) return rule.verification_type;
  const text = rule.reasoning || '';
  if (/后续阶段复核|后续阶段待复核|基线待后续阶段复核|基线\/D1\/随机前尚未到达/.test(text)) return 'future_phase';
  if (/(基线|D1|随机前).{0,24}(尚未|未到|未发生|待复核|后续阶段)/.test(text)) return 'future_phase';
  if (/溯源|既往源文件|更早.{0,8}(病历|诊断|检查|处方)|病史来源/.test(text)) return 'source_traceability';
  return 'other';
}
function ruleResultBadgeForRule(rule) {
  if (!rule || rule.result !== 'pass_verify') return ruleResultBadge(rule?.result);
  const type = verificationType(rule);
  const label = type === 'future_phase' ? '✓ 通过（后续阶段复核）'
    : type === 'source_traceability' ? '✓ 通过（溯源提醒）'
    : '✓ 通过（需验证）';
  return `<span class="badge badge-verify">${label}</span>`;
}
function ruleRowClass(rule) {
  if (rule?.is_child_rule) return 'expand-row rule-child-row';
  if (rule?.is_parent_rule) return 'expand-row rule-parent-row';
  return 'expand-row';
}
function ruleIdHtml(rule) {
  const id = escapeHtml(rule?.rule_id || '-');
  if (rule?.is_child_rule) return `<span class="rule-child-marker">↳</span><strong>${id}</strong>`;
  if (rule?.is_parent_rule) return `<strong>${id}</strong><span class="rule-parent-marker">父级</span>`;
  return `<strong>${id}</strong>`;
}
function formatFileSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / 1048576).toFixed(1) + ' MB';
}
function renderReviewScopeControls(workflow, project = null) {
  const phases = workflow?.review_phases || [{ phase_id: 'full', name: '全量审核' }];
  const fixedStage = projectStudyStage(project, workflow);
  const defaultPhase = phases.find(p => p.phase_id !== 'full')?.phase_id || phases[0]?.phase_id || 'full';
  const phaseOptions = phases.map(p => {
    const label = [p.name || p.phase_id, p.visit, p.day_window].filter(Boolean).join(' · ');
    return `<option value="${escapeHtml(p.phase_id)}" ${p.phase_id === defaultPhase ? 'selected' : ''}>${escapeHtml(label)}</option>`;
  }).join('');
  return `<div class="card" style="margin-bottom:16px">
    <div style="display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap">

  try {

      state.auth.user = '';
      state.auth.token = '';
      state.auth.role = '';
      localStorage.removeItem('enrollmentReviewUser');

    if (!hasAuthSession()) {

      state.auth.role = '';
      localStorage.removeItem('enrollmentReviewUser');
      localStorage.removeItem('enrollmentReviewToken');

async function submitRegister() {
  const username = document.getElementById('authUsername')?.value.trim() || '';
  const password = document.getElementById('authPassword')?.value || '';
  if (!username) { toast('请输入用户名', 'warning'); return; }
  try {
    const result = await registerUser(username, password);
    state.auth.hasUsers = true;
    state.auth.user = '';
    state.auth.token = '';
    state.auth.role = '';
    localStorage.removeItem('enrollmentReviewUser');
    localStorage.removeItem('enrollmentReviewToken');
    localStorage.removeItem('enrollmentReviewRole');
    toast('注册完成，请先阅读帮助页后登录', 'success');
    renderHeaderNav();
    renderHelpPage(true, result.username);
  } catch { /* handled */ }
}

async function submitLogin() {
  const username = document.getElementById('authUsername')?.value.trim() || '';
  const password = document.getElementById('authPassword')?.value || '';
  if (!username) { toast('请输入用户名', 'warning'); return; }
  try {
    const result = await loginUser(username, password);
    persistAuth(result);
    renderHeaderNav();
    if (result.requires_help) {
      renderHelpPage(true, result.username, 'login');
      return;
    }
    if ((location.hash || '#/') === '#/task') {
      await route();
    } else {
      navigate('#/task');
    }
  } catch { /* handled */ }
}

          <h3>已有项目-开始入排审核</h3>

        <li>若方案同时包含Ⅱ期和Ⅲ期，审核前必须选择本次适用阶段。</li>
        <li>入排审核不是只看固定入排条文，还要核对筛选期、基线期及基线前必须完成的检查、检验、评分和时间窗。</li>
        <li>批量审核前建议先跑 1 名受试者，确认 OCR、分类、阶段选择和规则拆解无明显偏差。</li>
      </ul>
    </div>
  `;
}

    </div>

    <div class="help-manual-grid">
      <div class="help-manual-card">
        <h3>一、打开系统和登录</h3>

        <ul>

          <li><strong>已有项目-方案重新解构：</strong>项目已存在，但方案版本更新、前次解构有遗漏，或需要按反馈让系统继续补充拆解时使用。</li>

      <div class="help-manual-card">

      <div class="help-manual-card">

          <li>进入受试者页面后上传源文件。建议按资料类型选择分类：病历、实验室报告、检查报告、评分/量表、既往资料、沟通记录等。</li>
          <li>上传资料时也可以补充或修改该受试者中心；中心格式建议为“06｜南方医科大学南方医院”。</li>
          <li>只拿到筛选期资料时，先选择筛选期审核；拿到基线/随机前资料后，再选择基线期或后续阶段审核。</li>
          <li>先对1名受试者点击处理/审核，观察OCR、证据引用和结论是否符合医学逻辑。</li>
        </ol>
      </div>
      <div class="help-manual-card">
        <h3>六、批量审核</h3>
        <ol>
          <li>在项目页只需选择本次审核阶段（例如筛选/导入期、基线/随机前）；研究期别已经由项目固定。</li>
          <li>确认每名受试者均已上传本阶段需要的资料；缺资料的受试者先不要批量。</li>
          <li>先完成1名受试者试跑并人工复核；没有明显分类/OCR/规则问题后，再点击批量处理。</li>
          <li>批量处理只会处理你有权限修改的待处理或错误状态受试者。已审核受试者如果要重跑，先点击重新审核或清除缓存。</li>
          <li>批量结束后按优先级复核：不通过、证据不足、证据冲突、需研究者判定、通过需验证、通过。通过需验证不单独改变整体通过结论。</li>
        </ol>
      </div>
    </div>

    <div class="help-manual-grid">
      <div class="help-manual-card">
        <h3>七、怎么看审核报告</h3>
        <ul>
          <li><strong>可入组：</strong>系统认为当前资料支持入组，但仍建议抽查关键证据。</li>
          <li><strong>不可入组：</strong>至少一条入选未满足或排除触发，必须查看具体规则和引用原文。</li>
          <li><strong>证据不足：</strong>系统没有找到足够证据，不等于受试者一定不可入组，通常需要补源文件或人工核对。</li>
          <li><strong>需研究者判定：</strong>方案要求医学判断，系统只能提示需由研究者/医学监查确认。</li>
          <li><strong>通过需验证：</strong>溯源提醒，结论可按通过走，但建议在最终归档前回看原始病历/报告。</li>

    </div>

      <div class="help-manual-card">

      <div class="help-manual-card">
        <h3>十、报告导出</h3>
        <ol>
          <li>进入项目页，点击“报告导出”。</li>
          <li>先选择审核阶段，例如筛选/导入期或基线/随机前。</li>
          <li>按项目导出：包含项目内所有已有受试者结论，只列不符合、证据不足和需研究者判定条目。</li>
          <li>按中心导出：选择中心后导出该中心受试者整改清单，符合条目不显示。</li>
          <li>按个人导出：选择受试者后导出完整逐条报告，通过、不适用、不符合、证据不足和需研究者判定条目都会显示。</li>
          <li>导出的报告文件可直接发给CRA/CRC/医学监查人员继续补证和整改跟踪；当前保存为通用文本报告格式。</li>
        </ol>
      </div>
    </div>

    <h3>十一、常见问题和处理方式</h3>
    <div class="help-troubleshoot">
      <table>
        <thead><tr><th>遇到的问题</th><th>先检查什么</th><th>建议处理</th></tr></thead>
        <tbody>
          <tr><td>双击后网页没打开</td><td>服务是否启动、浏览器是否被拦截</td><td>等待10秒；再手动打开 http://127.0.0.1:8900；仍失败则重新双击桌面入口。</td></tr>
          <tr><td>提示登录状态失效</td><td>是否长时间未操作、是否清空过浏览器数据</td><td>重新登录即可；普通账号密码留空时也要使用原用户名。</td></tr>
          <tr><td>看不到项目</td><td>是否已经登录、服务是否刷新到最新版本</td><td>所有登录用户应能只读看到项目；如看不到，先刷新网页并重新登录。</td></tr>
          <tr><td>项目或受试者只能查看不能操作</td><td>当前账号是否为项目创建者或该受试者上传者</td><td>这是权限控制。项目规则/项目信息由项目创建者或管理员修改；受试者资料由上传者或管理员修改。</td></tr>
          <tr><td>项目代号识别异常</td><td>方案首页、页眉页脚、方案编号字段是否清楚</td><td>先不要保存；在反馈框要求按首页“方案版本/日期、方案编号、项目编号”重新提取，再解构一次。</td></tr>
          <tr><td>方案阶段没有拆出来</td><td>研究流程表、筛选/基线/随机前访视是否在方案中</td><td>在重新解构反馈中明确要求“按研究流程表拆解需要入排审核的分期和各期必做项目”。</td></tr>
          <tr><td>OCR很慢</td><td>文件是否很大、扫描页是否很多、图片是否倾斜</td><td>先单名试跑；等待进度完成；扫描件过大时分批上传或减少无关页。</td></tr>
          <tr><td>OCR结果明显不对</td><td>关键数值、日期、单位、阴阳性是否识别错</td><td>补充更清晰文件；必要时清除缓存后重跑；结论按证据不足或人工复核处理。</td></tr>
          <tr><td>报告显示证据不足</td><td>是否缺少对应阶段资料，或资料没有被分到正确类型</td><td>补传原始病历/报告/评分表；确认阶段选择正确后重新审核。</td></tr>
          <tr><td>批量审核结果异常多</td><td>是否在错误阶段批量、规则是否遗漏基线前检查</td><td>暂停批量；回到方案重新解构或规则编辑；先重跑1名受试者确认后再继续。</td></tr>
          <tr><td>无法删除项目或受试者</td><td>当前账号是否为对应内容创建/上传者或超级管理员</td><td>项目只能由项目创建者/管理员删除；受试者只能由该受试者创建/上传者/管理员删除。</td></tr>
          <tr><td>中心名单无法修改</td><td>该中心是否由其他用户创建</td><td>别人创建的中心可以选择使用，但不能修改或删除；需要调整时联系创建者或管理员。</td></tr>
          <tr><td>报告导出没有某些通过条目</td><td>导出粒度是否为项目/中心</td><td>项目和中心报告只展示需处理条目；如需所有条目，请按个人导出。</td></tr>
        </tbody>
      </table>
    </div>

    <div class="help-actions">
      ${nextButton}
      <button class="btn btn-outline" onclick="window.print()">打印/另存帮助页</button>
    </div>
  </div>`;
}

  try {
    await markHelpSeen();

function protocolWorkbenchState() {
  if (!state.protocolWorkbench) {
    state.protocolWorkbench = { file: null, metadata: null, workflow: null, studyStage: '', rules: '', chatLog: [], lastProjectCode: '' };
  }
  return state.protocolWorkbench;
}

function renderWorkbenchMeta(meta) {
  if (!meta) return '<div class="status-line">尚未识别方案元信息</div>';
  const rows = [
    ['项目编号', meta.project_code || '-'],
    ['方案编号', meta.protocol_id || '-'],
    ['方案版本', meta.protocol_version || '-'],
    ['方案日期', meta.protocol_date || '-'],
    ['本次解构期别', meta.study_stage || '-'],
  ];
  return `<div class="workbench-meta">${rows.map(([k, v]) => `<div><span>${k}</span><strong>${escapeHtml(v)}</strong></div>`).join('')}</div>`;
}

function renderDeconstructStageSelect(id, selected = '') {
  return `<div class="form-group" style="margin-top:12px">
    <label>本次解构期别</label>
    <select id="${id}">
      <option value="" ${selected ? '' : 'selected'}>自动识别；如方案含Ⅱ/Ⅲ期会要求选择</option>
      <option value="Ⅱ期" ${selected === 'Ⅱ期' ? 'selected' : ''}>Ⅱ期</option>
      <option value="Ⅲ期" ${selected === 'Ⅲ期' ? 'selected' : ''}>Ⅲ期</option>
    </select>
    <div class="hint" style="margin-top:6px">若同一方案同时包含Ⅱ期和Ⅲ期，必须先选择本次解构哪一期；系统不会混合解构。</div>
  </div>`;
}

function renderWorkbenchChat(log) {
  if (!log || log.length === 0) {
    return '<div style="color:var(--gray-500)">可要求系统针对某个标准、时间窗、流程表项目或多阶段差异继续细化。</div>';
  }
  return log.map(item => `<div class="chat-row">
    <div class="chat-role">${escapeHtml(item.role)}</div>
    <div>${renderMarkdown(item.text || '')}</div>
  </div>`).join('');
}

function renderProtocolWorkbench(projects) {
  const wb = protocolWorkbenchState();
  const projectOptions = [
    '<option value="">保存为新项目</option>',
    ...(projects || []).map(p => `<option value="${escapeHtml(p.project_code)}" ${wb.lastProjectCode === p.project_code ? 'selected' : ''}>覆盖保存到 ${escapeHtml(p.project_code)}</option>`)
  ].join('');
  const fileName = wb.file ? `${escapeHtml(wb.file.name)} (${formatFileSize(wb.file.size)})` : '未选择方案文件';
  const hasFile = !!wb.file;
  const hasRules = !!(wb.rules && wb.rules.trim());
  return `<div class="protocol-workbench">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:12px;flex-wrap:wrap">
      <div>
        <h2 style="font-size:18px;color:var(--gray-900)">方案解构工作台</h2>
        <div style="font-size:12px;color:var(--gray-500);margin-top:2px">先把方案拆成可审核规则，再决定保存到哪个项目。</div>
      </div>
      <button class="btn btn-outline" onclick="clearProtocolWorkbench()">清空草稿</button>
    </div>
    <div class="workbench-grid">

function renderProjectCards(projects) {
  if (!projects || projects.length === 0) {
    return `<div class="empty-state"><div class="icon">📋</div><h3>暂无项目</h3><p>请先在“新项目-首次方案解构”中创建项目。</p></div>`;

    const pass = p.stats?.pass || 0, fail = p.stats?.fail || 0, insufficient = p.stats?.insufficient || 0, investigator = p.stats?.investigator || 0;
    const pending = p.stats?.pending || 0, total = p.subject_count || 0;
    const metaParts = [
      `项目编号: ${escapeHtml(p.project_code)}`,
      `方案编号: ${escapeHtml(p.protocol_id || '-')}`
    ];
    if (p.protocol_version) metaParts.push(`版本: ${escapeHtml(p.protocol_version)}`);
    if (p.protocol_date) metaParts.push(`方案日期: ${escapeHtml(p.protocol_date)}`);
    if (p.study_stage) metaParts.push(`解构期别: ${escapeHtml(p.study_stage)}`);
    return `<div class="card">
      <div class="project-card">
        <div class="info">
          <h3>${escapeHtml(displayProjectName(p))}</h3>
          <div class="meta">${metaParts.join(' | ')}</div>
          <div class="stats-grid">
            <div class="stat-item"><div class="stat-value">${total}</div><div class="stat-label">受试者总数</div></div>
            <div class="stat-item"><div class="stat-value" style="color:var(--success)">${pass}</div><div class="stat-label">可入组</div></div>
            <div class="stat-item"><div class="stat-value" style="color:var(--danger)">${fail}</div><div class="stat-label">不可入组</div></div>
            <div class="stat-item"><div class="stat-value" style="color:var(--warning)">${insufficient}</div><div class="stat-label">证据不足</div></div>
            <div class="stat-item"><div class="stat-value" style="color:var(--warning)">${investigator}</div><div class="stat-label">需研究者</div></div>
            <div class="stat-item"><div class="stat-value" style="color:var(--gray-500)">${pending}</div><div class="stat-label">未审核</div></div>
          </div>
        </div>
        <div class="actions" style="flex-direction:column">
          <button class="btn btn-secondary" onclick="navigate('#/project/${escapeHtml(p.project_code)}')">查看受试者</button>
          <button class="btn btn-outline" onclick="navigate('#/project/${escapeHtml(p.project_code)}?tab=info')">项目信息</button>

        </div>
      </div>
    </div>`;
  }).join('');
}

async function selectReDeconstructProject(code, rerender = true) {
  if (!code) return;
  state.reDeconstruct = { projectCode: code, project: null, originalRules: '', revisedRules: '', workflow: null, metadata: null, file: null, studyStage: '', changes: [] };
  try {
    const [project, rulesData] = await Promise.all([getProject(code), getRules(code)]);
    state.reDeconstruct.project = project;
    state.reDeconstruct.originalRules = rulesData.rules || '';
    state.reDeconstruct.studyStage = project.study_stage || '';
  } catch { /* handled */ }
  if (rerender) renderReDeconstructPage();
}

function reDeconstructDrop(e) {
  e.preventDefault();
  e.target.closest('.upload-zone').classList.remove('dragover');
  if (e.dataTransfer.files.length > 0) setReDeconstructFile(e.dataTransfer.files[0]);
}
function reDeconstructFileSelected(input) {
  if (input.files.length > 0) setReDeconstructFile(input.files[0]);
}
function setReDeconstructFile(file) {
  state.reDeconstruct.file = file;
  renderReDeconstructPage();
}
function clearReDeconstructFile() {
  state.reDeconstruct.file = null;
  renderReDeconstructPage();
}
function resetReDeconstructDraft() {
  const code = state.reDeconstruct.projectCode;
  if (!code) return renderReDeconstructPage();
  selectReDeconstructProject(code);
}
function syncRevisedRules() {
  const editor = document.getElementById('revisionEditor');
  if (editor) state.reDeconstruct.revisedRules = editor.value;
  toast('新结果编辑已保存在页面草稿中', 'success');
}
function setRevisionStatus(text, type = '') {
  const el = document.getElementById('revisionStatus');
  if (!el) return;
  el.textContent = text || '';
  el.style.color = type === 'error' ? 'var(--danger)' : type === 'success' ? 'var(--success)' : 'var(--gray-600)';
}
async function runReDeconstruct() {
  const rd = state.reDeconstruct;
  if (!rd.projectCode) { toast('请先选择项目', 'warning'); return; }
  const editor = document.getElementById('revisionEditor');
  if (editor) rd.revisedRules = editor.value;
  const feedback = document.getElementById('revisionFeedback')?.value.trim() || '';
  const mode = document.querySelector('input[name="revisionMode"]:checked')?.value || 'current';
  if (mode === 'upload' && !rd.file) { toast('请选择新方案文件，或切换为基于原项目方案修订', 'warning'); return; }
  const currentRules = rd.revisedRules || rd.originalRules;
  rd.studyStage = document.getElementById('revisionStudyStage')?.value || rd.studyStage || rd.project?.study_stage || '';
  setRevisionStatus(mode === 'upload' ? '正在基于新方案重新解构...' : '正在基于原方案和反馈修订...');
  try {
    const data = await deconstructProjectRevision(rd.projectCode, mode === 'upload' ? rd.file : null, feedback, currentRules, mode !== 'upload', rd.studyStage);
    rd.revisedRules = data.rules || '';
    rd.workflow = data.workflow || rd.workflow;
    rd.metadata = data.metadata || rd.metadata;
    rd.studyStage = data.study_stage || rd.metadata?.study_stage || rd.studyStage;
    rd.changes = data.changes || [];
    setRevisionStatus('重新解构完成', 'success');
    toast('新解构结果已生成，请并列复核后再保存', 'success');
    renderReDeconstructPage();
  } catch {
    setRevisionStatus('重新解构失败', 'error');
  }
}
async function saveReDeconstructRevision() {
  const rd = state.reDeconstruct;
  const editor = document.getElementById('revisionEditor');
  if (editor) rd.revisedRules = editor.value;
  if (!rd.projectCode || !rd.revisedRules.trim()) { toast('没有可保存的新结果', 'warning'); return; }
  const metadata = Object.assign({}, rd.project || {}, rd.metadata || {});
  metadata.study_stage = rd.studyStage || metadata.study_stage || '';
  const workflow = rd.workflow || {};
  try {
    const result = await saveProtocolDraft(rd.file, rd.revisedRules, metadata, workflow, rd.projectCode);
    toast(`已保存新解构结果到项目 ${result.project_code}`, 'success');
    await selectReDeconstructProject(rd.projectCode, false);
    navigate(`#/project/${rd.projectCode}?tab=rules`);
  } catch { /* handled */ }
}

async function runProtocolWorkbenchDeconstruct(mode) {
  const wb = protocolWorkbenchState();
  if (!wb.file) { toast('请先选择研究方案', 'warning'); return; }
  const editor = document.getElementById('protocolDraftEditor');
  if (editor) wb.rules = editor.value;
  wb.studyStage = document.getElementById('protocolWorkbenchStage')?.value || wb.studyStage || '';
  const feedback = mode === 'reset' ? '' : '';
  const currentRules = mode === 'reset' ? '' : wb.rules;
  setProtocolWorkbenchStatus(mode === 'reset' ? '正在重新解构方案...' : '正在上传并解构方案...');
  try {
    const data = await deconstructProtocolDraft(wb.file, feedback, currentRules, wb.studyStage);
    wb.metadata = data.metadata || wb.metadata;
    wb.workflow = data.workflow || wb.workflow;
    wb.studyStage = data.study_stage || wb.metadata?.study_stage || wb.studyStage;
    wb.rules = data.rules || '';
    wb.chatLog.push({ role: mode === 'reset' ? '系统' : '系统', text: `已完成方案解构，共 ${data.char_count || wb.rules.length} 字符。` });
    refreshCurrentPage();
    toast('方案解构完成，可继续编辑或保存到项目', 'success');
  } catch {
    setProtocolWorkbenchStatus('方案解构失败', 'error');
  }
}

async function applyProtocolWorkbenchFeedback() {
  const wb = protocolWorkbenchState();
  const feedbackEl = document.getElementById('protocolWorkbenchFeedback');
  const feedback = (feedbackEl?.value || '').trim();
  const editor = document.getElementById('protocolDraftEditor');
  if (!wb.file) { toast('请先选择研究方案', 'warning'); return; }
  if (!feedback) { toast('请输入需要进一步解构或修改的点', 'warning'); return; }
  wb.rules = editor ? editor.value : wb.rules;
  wb.studyStage = document.getElementById('protocolWorkbenchStage')?.value || wb.studyStage || '';
  wb.chatLog.push({ role: '你', text: feedback });
  setProtocolWorkbenchStatus('正在按反馈修订解构草稿...');
  try {
    const data = await deconstructProtocolDraft(wb.file, feedback, wb.rules, wb.studyStage);
    wb.metadata = data.metadata || wb.metadata;
    wb.workflow = data.workflow || wb.workflow;
    wb.studyStage = data.study_stage || wb.metadata?.study_stage || wb.studyStage;
    wb.rules = data.rules || '';
    wb.chatLog.push({ role: '系统', text: `已按反馈修订。当前草稿 ${data.char_count || wb.rules.length} 字符。` });
    if (feedbackEl) feedbackEl.value = '';
    refreshCurrentPage();
    toast('已按反馈修改草稿', 'success');
  } catch {
    setProtocolWorkbenchStatus('反馈修订失败', 'error');
  }
}

async function saveWorkbenchToProject(openAfterSave) {
  const wb = protocolWorkbenchState();
  const editor = document.getElementById('protocolDraftEditor');
  if (editor) wb.rules = editor.value;
  wb.studyStage = document.getElementById('protocolWorkbenchStage')?.value || wb.studyStage || wb.metadata?.study_stage || '';
  if (!wb.rules.trim()) { toast('没有可保存的规则草稿', 'warning'); return; }
  const target = document.getElementById('protocolSaveTarget')?.value || '';
  wb.lastProjectCode = target;
  const metadata = Object.assign({}, wb.metadata || {}, { study_stage: wb.studyStage });
  setProtocolWorkbenchStatus(target ? `正在保存到 ${target}...` : '正在保存为新项目...');
  try {
    const result = await saveProtocolDraft(wb.file, wb.rules, metadata, wb.workflow, target);
    wb.lastProjectCode = result.project_code;
    toast(`已保存到项目 ${result.project_code}`, 'success');
    if (openAfterSave) {
      navigate(`#/project/${result.project_code}?tab=rules`);
    } else {
      await refreshCurrentPage();
    }
  } catch {
    setProtocolWorkbenchStatus('保存失败', 'error');
  }
}

/* ============ New Project Modal ============ */
let newProjectProtocolFile = null;
let newProjectStudyStage = '';

function showNewProjectModal() {
  newProjectProtocolFile = null;
  newProjectStudyStage = '';
  showModal('新建项目', `
    <p style="margin-bottom:16px;color:var(--gray-600);font-size:14px">上传研究方案原文，系统会自动识别项目编号、方案编号、版本和方案日期，并同步解构入排规则。</p>
    <div class="upload-zone" id="newProjectDropZone" ondragover="event.preventDefault();this.classList.add('dragover')" ondragleave="this.classList.remove('dragover')" ondrop="newProjectDrop(event)">
      <div style="font-size:36px;margin-bottom:8px">📄</div>
      <p>拖放研究方案到此处，或 <label style="color:var(--primary);cursor:pointer;text-decoration:underline" for="newProjectFileInput">点击选择文件</label></p>
      <p class="hint">支持 PDF、DOCX、TXT；建议上传方案正文原文</p>
      <input type="file" id="newProjectFileInput" accept=".pdf,.docx,.doc,.txt" style="display:none" onchange="newProjectFileSelected(this)">
    </div>
    <div id="newProjectSelectedFile" class="file-list"></div>
    ${renderDeconstructStageSelect('newProjectStudyStage', newProjectStudyStage)}
    <div id="newProjectStatus" style="display:none;margin-top:16px">
      <div class="progress-container">
        <div class="progress-bar"><div class="progress-fill" id="newProjectProgress" style="width:0%"></div></div>
        <div class="progress-text" id="newProjectProgressText">准备中...</div>
      </div>
    </div>
  `, `
    <button class="btn btn-outline" onclick="closeModal()">取消</button>
    <button class="btn btn-primary" id="btnCreateProject" onclick="submitNewProject()" disabled>创建并解构</button>
  `);
}

function newProjectDrop(e) {
  e.preventDefault();
  e.target.closest('.upload-zone').classList.remove('dragover');
  const files = e.dataTransfer.files;
  if (files.length > 0) setNewProjectProtocolFile(files[0]);
}

function newProjectFileSelected(input) {
  if (input.files.length > 0) setNewProjectProtocolFile(input.files[0]);
}

function setNewProjectProtocolFile(file) {
  newProjectProtocolFile = file;
  const list = document.getElementById('newProjectSelectedFile');
  if (list) {
    list.innerHTML = `<div class="file-item"><span>📄 ${escapeHtml(file.name)}</span><span>${formatFileSize(file.size)}</span></div>`;
  }
  const btn = document.getElementById('btnCreateProject');
  if (btn) btn.disabled = false;
}

async function submitNewProject() {
  if (!newProjectProtocolFile) { toast('请先上传研究方案原文', 'warning'); return; }
  newProjectStudyStage = document.getElementById('newProjectStudyStage')?.value || '';
  const btn = document.getElementById('btnCreateProject');
  const statusDiv = document.getElementById('newProjectStatus');
  const progressFill = document.getElementById('newProjectProgress');
  const progressText = document.getElementById('newProjectProgressText');
  if (btn) { btn.disabled = true; btn.textContent = '处理中...'; }
  if (statusDiv) statusDiv.style.display = 'block';
  if (progressFill) progressFill.style.width = '35%';
  if (progressText) progressText.textContent = '正在上传方案并识别项目信息...';
  try {
    if (progressFill) progressFill.style.width = '60%';
    if (progressText) progressText.textContent = '正在解构入排规则和审核阶段，请稍候...';
    const result = await createProjectFromProtocol(newProjectProtocolFile, newProjectStudyStage);
    const projectCode = result.project_code || result.project?.project_code;
    if (progressFill) progressFill.style.width = '100%';
    if (progressText) progressText.textContent = result.deconstruct_error ? '项目已创建，但方案解构需要稍后重试。' : '项目创建和方案解构完成。';
    closeModal();
    if (result.deconstruct_error) {
      toast(`项目已创建，方案解构失败: ${result.deconstruct_error}`, 'warning', 7000);
    } else {
      toast('项目创建成功，入排规则已自动生成', 'success');
    }
    if (projectCode) navigate(`#/project/${projectCode}?tab=rules`);
    else renderAuditProjectList();
  } catch { /* toast shown by apiFetch */ }
  finally {
    if (btn) { btn.disabled = false; btn.textContent = '创建并解构'; }
  }
}

async function runCenterDeconstruct(pc) {
  const file = document.getElementById('centerImportFile')?.files?.[0] || null;
  const draftText = document.getElementById('centerImportDraft')?.value || '';
  const feedback = document.getElementById('centerImportFeedback')?.value || '';
  const status = document.getElementById('centerImportStatus');
  if (!file && !draftText.trim() && !feedback.trim()) { toast('请上传Excel/CSV，或粘贴中心名单文字', 'warning'); return; }
  if (status) status.textContent = '正在解构中心名单...';
  try {
    const data = await deconstructCenters(pc, file, draftText, feedback);
    const draft = data.draft_markdown || centersToDraftText(data.centers || []);
    const editor = document.getElementById('centerImportDraft');
    if (editor) editor.value = draft;
    if (status) status.textContent = `已生成草稿：${data.count || (data.centers || []).length} 个中心。请确认/修改后保存。`;
    toast('中心名单草稿已生成', 'success');
  } catch {
    if (status) status.textContent = '中心名单解构失败';
  }
}

function centersToDraftText(centers) {
  return (centers || []).map(c => `${c.center_code || ''}｜${c.center_name || ''}`).join('\n');
}

function parseCenterDraftText(text) {
  const rows = [];
  for (const raw of String(text || '').split(/\n+/)) {
    const line = raw.trim().replace(/^\||\|$/g, '');
    if (!line || line.includes('---') || /中心代号|中心名称/.test(line)) continue;
    const parts = line.split(/[|｜,\t]/).map(x => x.trim()).filter(Boolean);
    if (parts.length >= 2) rows.push({ center_code: parts[0], center_name: parts[1] });
  }
  return rows;
}

function applyCenterDraftToTable() {
  const text = document.getElementById('centerImportDraft')?.value || '';
  const centers = parseCenterDraftText(text);
  if (!centers.length) { toast('草稿中没有识别到中心代号/名称', 'warning'); return; }
  for (const center of centers) addCenterRow(center);
  toast(`已加入 ${centers.length} 个中心到上方表格，请确认后保存`, 'success');
}

  if (payload.scope === 'subject' && !payload.subjectId) { toast('请选择受试者', 'warning'); return; }
  try {
    const text = await fetchMarkdownReport(pc, payload);
    const suffix = [payload.scope || 'project', payload.centerCode || '', payload.subjectId || ''].filter(Boolean).join('_');
    downloadText(`${pc}_${suffix || 'report'}_入排审核报告.md`, text, 'text/markdown;charset=utf-8');
    toast('审核报告已导出', 'success');
  } catch { /* handled */ }
}

function downloadText(filename, text, type = 'text/plain;charset=utf-8') {
  const blob = new Blob([text], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

async function runDeconstruct(file, pc) {
  const statusDiv = document.getElementById('deconstructStatus');
  const progressFill = document.getElementById('deconstructProgress');
  const progressText = document.getElementById('deconstructProgressText');
  const feedback = document.getElementById('deconstructFeedback')?.value || '';
  const studyStage = document.getElementById('projectDeconstructStage')?.value || '';
  statusDiv.style.display = 'block';
  progressFill.style.width = '30%';
  progressText.textContent = '正在上传并解析方案文档...';

  const fd = new FormData();
  fd.append('file', file);
  if (feedback) fd.append('feedback', feedback);
  if (studyStage) fd.append('study_stage', studyStage);

  try {
    progressFill.style.width = '50%';
    progressText.textContent = '正在智能解构入选排除标准（可能需要1-2分钟）...';

    const resp = await fetch(`/api/projects/${pc}/deconstruct`, withAuthOptions({ method: 'POST', body: fd }));
    const data = await resp.json();

    if (!resp.ok) {
      throw new Error(typeof data.detail === 'string' ? data.detail : (data.detail?.message || '解构失败'));
    }

    progressFill.style.width = '100%';
    progressText.textContent = `解构完成！共提取 ${data.char_count} 字符的规则。`;

    // Update the rules editor with the new content
    const editor = document.getElementById('rulesEditor');
    if (editor) editor.value = data.rules;

    toast('方案解构完成，规则已加载到编辑器', 'success');

    // Close modal after a short delay
    setTimeout(() => { closeModal(); }, 1500);
  } catch (err) {
    progressFill.style.width = '100%';
    progressFill.style.background = 'var(--danger)';
    progressText.textContent = `解构失败: ${err.message}`;
    toast(`方案解构失败: ${err.message}`, 'error');
  }
}

function switchTab(tab, pc) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  const tabs = ['subjects', 'info', 'rules', 'export'];
  const idx = Math.max(0, tabs.indexOf(tab));
  const tabEls = document.querySelectorAll('.tab');
  if (tabEls[idx]) tabEls[idx].classList.add('active');
  const content = document.getElementById('tab-' + tabs[idx]);
  if (content) content.classList.add('active');
  history.replaceState(null, '', `#/project/${pc}${tabs[idx] === 'subjects' ? '' : '?tab=' + tabs[idx]}`);
}

}

async function bulkRerunSelected(pc) {
  const scope = getSelectedReviewScope();
  if (!scope) return;
  const targets = selectedSubjectsForProject(pc).filter(s => s.can_modify);
  if (!targets.length) { toast('请先勾选你有权限重新审核的受试者', 'warning'); return; }
  showProgressOverlay();
  let done = 0;
  const total = targets.length;
  const stageText = document.getElementById('progressStageText');
  const bar = document.getElementById('progressBar');
  const pctEl = document.getElementById('progressPercent');
  for (const subject of targets) {
    if (stageText) stageText.textContent = `正在重新审核 ${subject.subject_id} (${done + 1}/${total})`;
    try {
      await apiFetch(`${API}/projects/${pc}/subjects/${subject.subject_id}/rerun`, { method: 'POST' });
      await new Promise((resolve) => {
        processSubject(pc, subject.subject_id,
          (data) => updateProgress(data),
          () => { done++; if (bar) bar.style.width = (done / total * 100) + '%'; if (pctEl) pctEl.textContent = Math.round(done / total * 100) + '%'; resolve(); },
          () => { done++; resolve(); },
          scope
        );
      });
    } catch {
      done++;
    }
  }
  hideProgress();
  toast(`批量重新审核完成，共处理 ${total} 名受试者`, 'success');
  renderProject(pc);
}

function handleCatSelect(e, catKey) { handleCatDrop(e.target.files, catKey); }
function handleCatDrop(fileList, catKey) {
  const allowed = ['.pdf','.jpg','.jpeg','.png','.tiff','.doc','.docx'];
  for (const f of fileList) {
    const ext = '.' + f.name.split('.').pop().toLowerCase();
    if (!allowed.includes(ext)) { toast(`不支持: ${f.name}`, 'warning'); continue; }
    if (!uploadFiles_.some(x => x.name === f.name && x.size === f.size)) {
      uploadFiles_.push({ file: f, category: catKey });
    }
  }
  updateFileList();
}
function updateFileList() {
  // Update per-category counts
  const counts = {};
  for (const uf of uploadFiles_) {
    counts[uf.category] = (counts[uf.category] || 0) + 1;
  }
  for (const cat of UPLOAD_CATEGORIES) {
    const el = document.getElementById('count-' + cat.key);
    if (el) el.textContent = (counts[cat.key] || 0) + '个文件';
  }
  // Update detail area
  const area = document.getElementById('fileDetailArea');
  const btn = document.getElementById('uploadBtn');
  if (uploadFiles_.length === 0) {
    area.innerHTML = '';
    btn.disabled = true;
    btn.textContent = '增量上传 (0 个文件)';
    return;
  }
  area.innerHTML = '<div class="file-list">' + uploadFiles_.map((uf, i) => {
    const cat = UPLOAD_CATEGORIES.find(c => c.key === uf.category);
    return `<div class="file-item"><span>${cat?.icon||'📄'} <strong>[${cat?.label||uf.category}]</strong> ${escapeHtml(uf.file.name)} (${formatFileSize(uf.file.size)})</span><button class="btn btn-sm" style="background:none;color:var(--danger);padding:0" onclick="removeUploadFile(${i})">✕</button></div>`;
  }).join('') + '</div>';
  btn.disabled = false;
  btn.textContent = `增量上传 (${uploadFiles_.length} 个文件)`;
}
function removeUploadFile(i) { uploadFiles_.splice(i, 1); updateFileList(); }

async function doUpload(pc, sid) {
  if (uploadFiles_.length === 0) return;
  const btn = document.getElementById('uploadBtn');
  btn.disabled = true; btn.textContent = '上传中...';
  try {
    // Build FormData with files
    const fd = new FormData();
    for (const uf of uploadFiles_) {
      fd.append('files', uf.file);
      fd.append('categories', uf.category);
    }
    const centerCode = document.getElementById('upload_center_code')?.value.trim() || '';
    const centerName = document.getElementById('upload_center_name')?.value.trim() || '';
    if (centerCode) fd.append('center_code', centerCode);
    if (centerName) fd.append('center_name', centerName);
    await apiFetch(`${API}/projects/${pc}/subjects/${sid}/upload`, { method: 'POST', body: fd });
    closeModal();
    toast(`成功增量上传 ${uploadFiles_.length} 个文件；如已有审核结论，请重新审核`, 'success');
    renderProject(pc);
  } catch {
    btn.disabled = false;
    btn.textContent = `增量上传 (${uploadFiles_.length} 个文件)`;
  }
}

async function startProcessingWithScope(pc, sid, phase = 'full', studyStage = '') {
  const scope = { phase: phase || 'full', studyStage: studyStage || projectStudyStage() || '' };

  processSubject(pc, sid,
    (data) => updateProgress(data),
    async (data) => {

async function batchProcess(pc) {
  const scope = getSelectedReviewScope();
  if (!scope) return;
  const selected = selectedSubjectIds(pc);
  const source = selected.length ? selectedSubjectsForProject(pc) : state.subjects;
  const pendingSubjects = source.filter(s => s.can_modify && (s.status === 'pending' || s.status === 'error'));
  if (pendingSubjects.length === 0) {
    toast(selected.length ? '勾选范围内没有你可处理的待处理/错误受试者' : '没有你可处理的待处理/错误受试者', 'info');
    return;
  }
  showProgressOverlay();
  let done = 0;
  const total = pendingSubjects.length;
  const stageText = document.getElementById('progressStageText');
  const bar = document.getElementById('progressBar');
  const pctEl = document.getElementById('progressPercent');

  for (const subj of pendingSubjects) {
    if (stageText) stageText.textContent = `正在处理 ${subj.subject_id} (${done + 1}/${total})`;
    await new Promise((resolve) => {
      processSubject(pc, subj.subject_id,
        (data) => updateProgress(data),
        () => { done++; if (bar) bar.style.width = (done / total * 100) + '%'; if (pctEl) pctEl.textContent = Math.round(done / total * 100) + '%'; resolve(); },
        () => { done++; resolve(); },
        scope
      );
    });
  }
  hideProgress();
  toast(`批量处理完成，共处理 ${total} 名受试者`, 'success');
  renderProject(pc);
}
