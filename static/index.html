async function renderReport(projectCode, subjectId) {
  state.view = 'report';
  state.currentProject = projectCode;
  state.currentSubject = subjectId;
  const urlParams = new URLSearchParams(location.hash.split('?')[1] || '');
  let workflow = { review_phases: [{ phase_id: 'full', name: '全量审核' }] };
  try {
    workflow = await getProjectPhases(projectCode);
  } catch { /* fallback above */ }
  const defaultReportPhase = (workflow.review_phases || []).find(p => p.phase_id !== 'full')?.phase_id
    || workflow.review_phases?.[0]?.phase_id
    || 'full';
  const reportPhase = urlParams.get('phase') || defaultReportPhase;
  const reportStudyStage = urlParams.get('study_stage') || projectStudyStage(null, workflow) || '';
  app.innerHTML = `<div class="loading-text"><span class="spinner"></span> 加载审核报告...</div>`;

  let report;
  try {
    report = await getReport(projectCode, subjectId, reportPhase);
    state.report = report;
  } catch {
    app.innerHTML = `<div class="empty-state"><div class="icon">📄</div><h3>暂无报告</h3><p>该受试者尚未完成审核</p><br><button class="btn btn-secondary" onclick="navigate('#/project/${escapeHtml(projectCode)}')">返回项目</button></div>`;
    return;
  }

  const verdict = report.verdict || 'unknown';
  let verdictCardClass = 'verdict-insufficient', verdictIcon = '⚠️', verdictText = '需处理';
  if (verdict === 'pass') { verdictCardClass = 'verdict-pass'; verdictIcon = '✅'; verdictText = '可入组'; }
  else if (verdict === 'pass_verify') { verdictCardClass = 'verdict-pass'; verdictIcon = '✅'; verdictText = '可入组（需验证）'; }
  else if (verdict === 'fail') { verdictCardClass = 'verdict-fail'; verdictIcon = '❌'; verdictText = '不可入组'; }
  else if (verdict === 'insufficient') { verdictCardClass = 'verdict-insufficient'; verdictIcon = '⚠️'; verdictText = '证据不足'; }
  else if (verdict === 'investigator') { verdictCardClass = 'verdict-insufficient'; verdictIcon = '🟡'; verdictText = '需研究者判定'; }

  // Pass-with-reminder rules callouts
  const verifyRules = (report.rule_results || []).filter(r => r.result === 'pass_verify');
  const sourceVerifyRules = verifyRules.filter(r => verificationType(r) !== 'future_phase');
  const futureVerifyRules = verifyRules.filter(r => verificationType(r) === 'future_phase');
  let verifyCallout = '';
  if (sourceVerifyRules.length > 0) {
    verifyCallout += `<div class="callout callout-success">
      <span>✓</span>
      <div><strong>溯源提醒</strong> — 以下 ${sourceVerifyRules.length} 条标准按通过处理，但建议在最终归档前补充或核对更早的既往病历、诊断证明、既往检查报告、处方或病程记录：
        <ul style="margin:8px 0 0 16px">${sourceVerifyRules.map(r => `<li>${escapeHtml(r.rule_name || r.rule_id || '未知规则')}</li>`).join('')}</ul>
      </div>
    </div>`;
  }
  if (futureVerifyRules.length > 0) {
    verifyCallout += `<div class="callout callout-success">
      <span>✓</span>
      <div><strong>后续阶段复核提醒</strong> — 以下 ${futureVerifyRules.length} 条标准当前阶段按通过处理，基线/D1/随机前资料到达后需在对应阶段复核：
        <ul style="margin:8px 0 0 16px">${futureVerifyRules.map(r => `<li>${escapeHtml(r.rule_name || r.rule_id || '未知规则')}</li>`).join('')}</ul>
      </div>
    </div>`;
  }

  // Insufficient rules callout
  const insufficientRules = (report.rule_results || []).filter(r => r.result === 'insufficient');
  let insufficientCallout = '';
  if (insufficientRules.length > 0) {
    insufficientCallout = `<div class="callout callout-warning">
      <span>⚠️</span>
      <div><strong>需补充资料</strong> — 以下 ${insufficientRules.length} 条标准证据不足，请补充相关文件后重新审核：
        <ul style="margin:8px 0 0 16px">${insufficientRules.map(r => `<li>${escapeHtml(r.rule_name || r.rule_id || '未知规则')}</li>`).join('')}</ul>
      </div>
    </div>`;
  }
  const investigatorRules = (report.rule_results || []).filter(r => r.result === 'investigator');
  let investigatorCallout = '';
  if (investigatorRules.length > 0) {
    investigatorCallout = `<div class="callout callout-warning">
      <span>🟡</span>
      <div><strong>需研究者判定</strong> — 以下 ${investigatorRules.length} 条标准已有资料不足以由系统直接给出最终医学判断，请研究者或医学监查确认：
        <ul style="margin:8px 0 0 16px">${investigatorRules.map(r => `<li>${escapeHtml(r.rule_name || r.rule_id || '未知规则')}</li>`).join('')}</ul>
      </div>
    </div>`;
  }

  // Rules table
  let rulesTable = '';
  if (report.rule_results && report.rule_results.length > 0) {
    rulesTable = `<h3 style="margin:24px 0 12px;font-size:16px">逐条审核结果</h3>
    <div class="mobile-scroll-hint">表格列较多，可左右滑动查看完整推理依据。</div>
    <div class="table-wrap"><table class="data-table report-rules-table">
      <thead><tr><th class="col-rule-id">规则ID</th><th class="col-rule-name">标准名称</th><th class="col-rule-type">类别</th><th class="col-rule-verdict">结论</th><th>推理依据（点击展开）</th></tr></thead>
	      <tbody>${report.rule_results.map((r, i) => `
	        <tr class="${ruleRowClass(r)}" onclick="toggleExpand('rule-${i}')">
	          <td class="cell-nowrap">${ruleIdHtml(r)}</td>
	          <td>${escapeHtml(r.rule_name || '-')}</td>
          <td class="cell-nowrap">${r.rule_type === 'inclusion' ? '入选' : r.rule_type === 'exclusion' ? '排除' : escapeHtml(r.rule_type || '-')}</td>
          <td class="cell-nowrap">${ruleResultBadgeForRule(r)}</td>
          <td style="max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml((r.reasoning || '').substring(0, 80))}${(r.reasoning||'').length > 80 ? '...' : ''}</td>
        </tr>
        <tr class="expand-detail" id="detail-rule-${i}">
          <td colspan="5">
            <div class="expand-content">
              <div class="reasoning" style="line-height:1.8"><strong>🔍 推理过程：</strong><br>${renderMarkdown(r.reasoning || '暂无详细说明')}</div>
            </div>
          </td>
        </tr>
      `).join('')}</tbody>
    </table></div><div id="subjectFilteredEmpty" class="empty-state" style="display:none"><div class="icon">🔎</div><h3>当前筛选条件下无受试者</h3><p>请调整表头筛选条件或清除筛选</p></div>`;
  }

  // Group results
  let groupResults = '';
  if (report.group_results && report.group_results.length > 0) {
    groupResults = `<h3 style="margin:24px 0 12px;font-size:16px">分组审核结果</h3>
    <div class="table-wrap"><table>
      <thead><tr><th>分组</th><th>结论</th><th>说明</th></tr></thead>
      <tbody>${report.group_results.map(g => `<tr>
        <td>${escapeHtml(g.group_name || g.group_id || '-')}</td>
        <td>${ruleResultBadge(g.result)}</td>
        <td>${escapeHtml(g.summary || '-')}</td>
      </tr>`).join('')}</tbody>
    </table></div>`;
  }

  // Evidence viewer
  let evidenceViewer = '';
  if (report.chunks && report.chunks.length > 0) {
    evidenceViewer = `<div class="evidence-section">
      <div class="evidence-toggle" onclick="toggleEvidence()">
        <span>📄 原始证据 (共 ${report.chunks.length} 个文档片段)</span>
        <span id="evidenceArrow">▶</span>
      </div>
      <div class="evidence-body" id="evidenceBody">
        ${report.chunks.map((c, i) => `<div class="evidence-chunk">
          <div class="chunk-header">${escapeHtml(c.source || c.filename || '文档')} — 片段 ${i + 1}${c.page ? ' (第' + c.page + '页)' : ''}</div>
          <pre>${escapeHtml(c.text || c.content || '')}</pre>
        </div>`).join('')}
      </div>
    </div>`;
  }

  app.innerHTML = `
    <div class="breadcrumb">
      <a href="#/audit">项目列表</a><span class="sep">›</span>
      <a href="#/project/${escapeHtml(projectCode)}">${escapeHtml(projectCode)}</a><span class="sep">›</span>
      <span>受试者 ${escapeHtml(subjectId)}</span>
    </div>
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px">

          <h2 style="font-size:18px">受试者: ${escapeHtml(subjectId)}</h2>

    <div class="verdict-card ${verdictCardClass}">

    </div>

    ${verifyCallout}

function toggleExpand(id) {
  const row = document.querySelector(`tr[onclick="toggleExpand('${id}')"]`);
  const detail = document.getElementById('detail-' + id);
  if (!row || !detail) return;
  row.classList.toggle('open');
  detail.classList.toggle('show');
}

function toggleEvidence() {
  const body = document.getElementById('evidenceBody');
  const arrow = document.getElementById('evidenceArrow');
  if (body.classList.contains('show')) {
    body.classList.remove('show');
    arrow.textContent = '▶';
  } else {
    body.classList.add('show');
    arrow.textContent = '▼';
  }
}

async function exportReportMd(pc, sid, phase = 'full') {
  try {
    const r = await apiFetch(`${API}/projects/${pc}/subjects/${sid}/report/md?phase=${encodeURIComponent(phase || 'full')}`);
    if (!r.ok) throw new Error('获取报告失败');
    const text = await r.text();
    const blob = new Blob([text], { type: 'text/markdown;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${sid}_审核报告.md`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    toast('报告已导出', 'success');
  } catch (err) {
    toast('导出失败: ' + err.message, 'error');
  }
}

window.addEventListener('unhandledrejection', function(e) {
  console.error('Unhandled rejection:', e.reason);
  toast('请求失败: ' + (e.reason?.message || String(e.reason)).substring(0,100), 'error');
});
</script>
