[project]
name = "enrollment-review-v2"
version = "0.1.0"
description = "本地临床试验入排审核工作台 V2"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic==1.19.1",
  "fastapi==0.128.8",
  "pdfplumber==0.11.10",
  "pydantic==2.13.3",
  "python-docx==1.2.0",
  "sqlalchemy==2.0.52",
  "uvicorn==0.39.0",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "jsonschema==4.26.0",
  "openpyxl==3.1.5",
  "openai==2.37.0",
  "pymupdf==1.26.4",
  "pytest==9.0.2",
  "python-multipart==0.0.20",
  "requests==2.32.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]

[tool.uv]
package = false
